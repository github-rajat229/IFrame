<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        form {
            height: auto;
            width: 58vh;
            background-color: white;
            border-radius: 4vh;
            padding: 4vh 3vh;
        }
        h1 {
            margin-top: 2vh;
            margin-bottom: 3vh;
            font-size: 3.5vh;
        }
        .basic, .email, .password, .button {
            width: 90%;
            margin: auto;
            margin-top: 2vh;
            font-size: 1.6vh;
        }
        input {
            margin-top: 1vh;
            font-size: 1.5vh;
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, skyblue, purple 80%);
            border-radius: 2.5vh;
            border: none;
            color: white;
            height: 5.5vh;
            font-size: 1.8vh;
            cursor: pointer;
            margin-top: 1vh;
        }
        .button {
            height: auto;
            margin-top: 3vh;
        }
        .button > p {
            text-align: center;
            margin-top: 2vh;
            font-size: 1.6vh;
        }
        .button > input {
            margin-left: 30%;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="con">
        <form action="">
            <h1 align="center">Sign Up</h1>
            <div class="basic">
                <label for="">First Name:</label>
                <input type="text" name="" id=""><br>   
                <label for="">Last Name:</label>
                <input type="text" name="" id="">
                <br>
                <label for="">Gender:</label>
                <input type="radio" name="Gender">Male
                <input type="radio" name="Gender" id="">Female
                <br>
                <label for="">Date of Birth:</label>
                <input type="date" name="" id="">
                <br>
                <label for="">Mobile No:</label>
                <input type="tel" name="" id="">
            </div>
            <div class="email">
                <label for="">Email:</label>
                <input type="email" name="" id="">
                <br>
                <label for="">Confirm Email:</label>
                <input type="email" name="" id="">
            </div>
            <div class="password">
                <label for="">Password:</label>
                <input type="password" name="" id="">
                <br>
                <label for="">Confirm Password:</label>
                <input type="password" name="" id="">
            </div>
            <div class="button">
                <input type="checkbox" name="" id=""> Terms And Condition
                <br>
                <button>Sign Up</button>
                <p>Already A Member? <a href="index.html">Log In</a></p>
            </div>
        </form>
    </div>
</body>
</html>
