<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .con{
            border: 1px solid black;
            height: 800px;
        }
        .header{
            height: 20%;
            border: 1px solid black;
            background-color:#55bdfd;
        }
            
        .center{
            height: 60%;
            background-color:rgb(221, 255, 0);
            display: flex;
        }
            
        .left{
            height: 100%;
            width: 20%;
            border: 1px solid black;
            background-color:#5f6a73;
        }
        .right{
            background-color: rgb(255, 0, 0);
            height: 100%;
            border: 1px solid black;
            width: 100%;
        }
        .top{
            height: 50%;
            background-color: #ffffff;
            border: 1px solid black;
        }
        .bottom{
            height: 50%;
            background-color: #00bcc9c7;
            display: flex;
        }
        .bottom1{
            width: 50%;
        }
        .b1{
            background: #006f7d;
            border: 1px solid black;
        }
        .b2{
            background: #02949f;
            border: 1px solid black;
        }
        .footer{
            height: 20%;
            border: 1px solid black;
            background-color:rgb(7, 70, 159);
        }
    </style>
</head>
<body>
    <h1 align="Center">Flex-Box</h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
                <div class="left"></div>
                <div class="right">
                    <div class="top"></div>
                    <div class="bottom">
                        <div class="bottom1 b1"></div>
                        <div class="bottom1 b2"></div>
                    </div>
                </div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
