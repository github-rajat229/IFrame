<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gallery</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .con{
            /* border: 1px solid black; */
            display: flex;
        }
        .box{
            width: 25%;
            /* border: 1px solid black; */
            height: 100%;   
        }
        img{
            width: 100%;
        }
    </style>
</head>
<body>
    <h1 align="Center">Dynamic Gallery</h1>
    <div class="con">
        <div class="box">
            <img src="assests/image.jpg" alt="">
            <img src="assests/image2.jpg" alt="">
            <img src="assests/image4.jpg" alt="">
            <img src="assests/image3.jpg" alt="">
        </div>
        <div class="box">
            <img src="assests/image2.jpg" alt="">
            <img src="assests/image.jpg" alt="">
            <img src="assests/image3.jpg" alt="">
            <img src="assests/image4.jpg" alt="">
        </div>
        <div class="box">
            <img src="assests/image4.jpg" alt="">
            <img src="assests/image3.jpg" alt="">
            <img src="assests/image.jpg" alt="">
            <img src="assests/image2.jpg" alt="">
        </div>
        <div class="box">
            <img src="assests/image3.jpg" alt="">
            <img src="assests/image4.jpg" alt="">
            <img src="assests/image2.jpg" alt="">
            <img src="assests/image.jpg" alt="">
        </div>
    </div>
</body>
</html>
