<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box {
            height: 100vh;
            background: linear-gradient(40deg, cyan, black);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .nav {
            height: 10vh;
            width: 80vw;
            max-width: 900px;
            border-radius: 5vh;
            background-color: rgba(198, 198, 126, 0.5);
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 2vw;
        }
        h1 {
            font-size: clamp(14px, 2.5vh, 25px);
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            display: inline-block;
        }
        a:hover {
            transform: scale(1.2);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="nav">
            <a href="index.html"><h1>Home</h1></a>
            <a href="aboutus.html"><h1>About Us</h1></a>
            <a href="gallery.html"><h1>Gallery</h1></a>
            <a href="achievement.html"><h1>Achievement</h1></a>
            <a href="contactus.html"><h1>Contact Us</h1></a>
        </div>
    </div>
</body>
</html>
